<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AR Pyramid — Face Tracker</title>
<style>
  :root{
    --ink:#eef1f5;
    --sub:#9aa4b2;
    --accent:#5ee6c6;
    --bg:#0a0c10;
    --panel: rgba(12,15,20,0.72);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background:var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color:var(--ink);
    overflow:hidden;
  }
  #stage{
    position:relative;
    width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center;
  }
  video{
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    object-fit:cover;
    transform:scaleX(-1); /* mirror for selfie view */
    filter:saturate(1.05) contrast(1.02);
  }
  canvas.overlay{
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    pointer-events:none;
  }
  #hud{
    position:absolute;
    top:20px; left:20px; right:20px;
    display:flex; justify-content:space-between; align-items:flex-start;
    z-index:5;
    pointer-events:none;
  }
  .badge{
    font-size:12px; letter-spacing:.03em;
    color:var(--sub);
    background:var(--panel);
    border:1px solid rgba(255,255,255,0.08);
    padding:8px 12px;
    border-radius:10px;
    backdrop-filter: blur(6px);
  }
  #status-dot{
    display:inline-block; width:7px; height:7px; border-radius:50%;
    background:#666; margin-right:7px; position:relative; top:-1px;
  }
  #status-dot.live{ background:var(--accent); box-shadow:0 0 8px var(--accent); }

  #start-screen{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:18px;
    background:radial-gradient(circle at 50% 40%, #14181f 0%, #0a0c10 70%);
    z-index:10;
    text-align:center;
    padding:24px;
  }
  #start-screen h1{
    font-size:22px; font-weight:600; margin:0;
    letter-spacing:-0.01em;
  }
  #start-screen p{
    color:var(--sub); font-size:14px; max-width:340px; margin:0; line-height:1.5;
  }
  #start-btn{
    margin-top:8px;
    background:var(--accent);
    color:#06120f;
    border:none;
    padding:13px 26px;
    border-radius:999px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:0 0 0 0 rgba(94,230,198,0.4);
  }
  #start-btn:hover{ transform:translateY(-1px); box-shadow:0 6px 18px rgba(94,230,198,0.25); }
  #start-btn:active{ transform:translateY(0); }
  #start-btn:disabled{ opacity:.6; cursor:default; }

  #err{
    color:#ff8a8a; font-size:13px; max-width:340px; display:none;
  }

  #footer-hint{
    position:absolute;
    bottom:18px; left:0; right:0;
    text-align:center;
    font-size:12px;
    color:var(--sub);
    z-index:5;
    pointer-events:none;
  }
</style>
</head>
<body>

<div id="stage">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="three-canvas" class="overlay"></canvas>

  <div id="hud">
    <div class="badge"><span id="status-dot"></span><span id="status-text">idle</span></div>
    <div class="badge" id="face-count">0 faces</div>
  </div>

  <div id="footer-hint">move your head — the translucent pyramid tracks your face's position, tilt &amp; size</div>

  <div id="start-screen">
    <h1>Pyramid on your face</h1>
    <p>Uses your webcam locally in-browser to find your face and rest a small 3D pyramid on your forehead. Nothing is recorded or uploaded.</p>
    <button id="start-btn">Enable camera</button>
    <p id="err"></p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

<script>
(function(){
  const video = document.getElementById('video');
  const startScreen = document.getElementById('start-screen');
  const startBtn = document.getElementById('start-btn');
  const errEl = document.getElementById('err');
  const statusDot = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');
  const faceCountEl = document.getElementById('face-count');
  const canvas3d = document.getElementById('three-canvas');

  let renderer, scene, camera, pyramid, glow;
  let currentLandmarks = null;
  let smoothed = null; // {x,y,scale,roll}

  function initThree(){
    renderer = new THREE.WebGLRenderer({ canvas: canvas3d, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

    scene = new THREE.Scene();
    // Standard screen-space ortho camera: frustum centered on (0,0), camera
    // pulled back along +Z looking at the origin. This is the well-tested
    // conventional setup (vs. the nonstandard top=0/bottom=h, near=-10/far=10
    // frustum used earlier, which sat the camera at the same Z as the object
    // and used an inverted top/bottom convention).
    camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 3000);
    camera.position.z = 1000;
    resizeRenderer();

    // Pyramid: 4-sided cone = square-base pyramid, left as Three.js builds it
    // (apex at local +Y, base at local -Y) — no extra flips, so its winding
    // and normals stay exactly as Three.js generates them.
    const geo = new THREE.ConeGeometry(0.75, 0.85, 4);
    geo.rotateY(Math.PI / 4);
    const mat = new THREE.MeshStandardMaterial({
      color: 0x5ee6c6,
      metalness: 0.25,
      roughness: 0.4,
      emissive: 0x0d3d33,
      emissiveIntensity: 0.25,
      flatShading: true
    });
    pyramid = new THREE.Mesh(geo, mat);
    scene.add(pyramid);

    const edgeGeo = new THREE.EdgesGeometry(geo);
    const edgeMat = new THREE.LineBasicMaterial({ color: 0xeafffa });
    const edges = new THREE.LineSegments(edgeGeo, edgeMat);
    pyramid.add(edges);

    // solid ring at the base to sell contact with the head
    const ringGeo = new THREE.RingGeometry(0.35, 0.62, 32);
    const ringMat = new THREE.MeshStandardMaterial({ color:0x3fb89e, side:THREE.DoubleSide });
    glow = new THREE.Mesh(ringGeo, ringMat);
    glow.rotation.x = -Math.PI/2;
    glow.position.y = -0.45;
    pyramid.add(glow);

    const key = new THREE.DirectionalLight(0xffffff, 1.1);
    key.position.set(1, 2, 3);
    scene.add(key);
    scene.add(new THREE.AmbientLight(0x8899aa, 0.9));

    window.addEventListener('resize', resizeRenderer);
    animate();
  }

  function resizeRenderer(){
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    // Centered convention: left/right = ±w/2, top/bottom = ±h/2. Screen
    // pixel coordinates are converted to this space in animate().
    camera.left = -w / 2; camera.right = w / 2;
    camera.top = h / 2; camera.bottom = -h / 2;
    camera.updateProjectionMatrix();
  }

  function lerp(a,b,t){ return a + (b-a)*t; }

  // The <video> is displayed with object-fit:cover, which crops it to fill
  // the viewport. FaceMesh landmarks are normalized (0..1) against the RAW
  // video frame, not the cropped/displayed area, so we have to replicate the
  // cover math here to turn a landmark into an on-screen pixel correctly —
  // otherwise the overlay drifts away from the actual face whenever the
  // camera's aspect ratio doesn't match the window's.
  function getCoverTransform(){
    const vw = video.videoWidth || 1280, vh = video.videoHeight || 720;
    const cw = window.innerWidth, ch = window.innerHeight;
    const scale = Math.max(cw / vw, ch / vh);
    const dispW = vw * scale, dispH = vh * scale;
    return { scale, offsetX: (cw - dispW) / 2, offsetY: (ch - dispH) / 2, dispW, dispH };
  }

  function animate(){
    requestAnimationFrame(animate);

    if (currentLandmarks){
      // MediaPipe FaceMesh landmark indices (normalized 0..1, video space, NOT mirrored)
      const lm = currentLandmarks;
      const leftEye  = lm[33];
      const rightEye = lm[263];

      // Full-face bounding box using only the stable face-oval contour
      // landmarks (not all 468+ points — with refineLandmarks on, the extra
      // iris points can sit slightly outside the face silhouette and skew
      // the box's center/size).
      const FACE_OVAL = [10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];
      let minX = 1, maxX = 0, minY = 1, maxY = 0;
      for (let i = 0; i < FACE_OVAL.length; i++){
        const p = lm[FACE_OVAL[i]];
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
      }
      const cxN = (minX + maxX) / 2;
      const cyN = (minY + maxY) / 2;
      const boxWN = maxX - minX;
      const boxHN = maxY - minY;

      const eyeDX = (rightEye.x - leftEye.x);
      const eyeDY = (rightEye.y - leftEye.y);
      const roll = Math.atan2(eyeDY, eyeDX);

      const ct = getCoverTransform();
      const cw = window.innerWidth;

      // map normalized video-space coords -> displayed pixel coords, then
      // mirror horizontally to match the CSS-mirrored (selfie-view) video
      const centerPx = ct.offsetX + cxN * ct.dispW;
      const centerPy = ct.offsetY + cyN * ct.dispH;
      const px = cw - centerPx;
      const py = centerPy;

      const boxWPx = boxWN * ct.dispW;
      const boxHPx = boxHN * ct.dispH;

      const pyramidScale = Math.max(90, Math.max(boxWPx, boxHPx) * 2.5);

      const target = {
        x: px - window.innerWidth / 2,   // screen px -> centered world x
        // screen py (y-down) -> centered world y (y-up), lifted up so the
        // pyramid's base lands around the chin/neck line instead of the
        // chest, leaving the neck visible below it
        y: (window.innerHeight / 2 - py) + pyramidScale * 0.1,
        // face landmarks only cover the face oval, not the full head (hair,
        // ears, chin margin), so pad generously to actually cover the head
        scale: pyramidScale,
        roll: -roll // account for mirroring
      };

      if (!smoothed) smoothed = { ...target };
      const t = 1.35;
      smoothed.x = lerp(smoothed.x, target.x, t);
      smoothed.y = lerp(smoothed.y, target.y, t);
      smoothed.scale = lerp(smoothed.scale, target.scale, t);
      smoothed.roll = lerp(smoothed.roll, target.roll, t);

      pyramid.visible = true;
      pyramid.position.set(smoothed.x, smoothed.y, 0);
      pyramid.scale.setScalar(smoothed.scale);
      pyramid.rotation.z = smoothed.roll;
    } else if (pyramid) {
      pyramid.visible = false;
    }

    renderer.render(scene, camera);
  }

  function setStatus(text, live){
    statusText.textContent = text;
    statusDot.classList.toggle('live', !!live);
  }

  async function start(){
    startBtn.disabled = true;
    errEl.style.display = 'none';
    setStatus('requesting camera…', false);
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      video.srcObject = stream;
      await video.play();

      initThree();

      const faceMesh = new FaceMesh({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
      });
      faceMesh.setOptions({
        maxNumFaces: 1,
        refineLandmarks: true,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6
      });
      faceMesh.onResults((results) => {
        if (results.multiFaceLandmarks && results.multiFaceLandmarks.length){
          currentLandmarks = results.multiFaceLandmarks[0];
          faceCountEl.textContent = '1 face';
          setStatus('tracking', true);
        } else {
          currentLandmarks = null;
          faceCountEl.textContent = '0 faces';
          setStatus('searching…', false);
        }
      });

      const mpCamera = new Camera(video, {
        onFrame: async () => { await faceMesh.send({ image: video }); },
        width: 1280,
        height: 720
      });
      mpCamera.start();

      startScreen.style.display = 'none';
    } catch (e){
      console.error(e);
      errEl.textContent = 'Could not access the camera (' + (e.message || e.name) + '). Check permissions and try again.';
      errEl.style.display = 'block';
      startBtn.disabled = false;
      setStatus('error', false);
    }
  }

  startBtn.addEventListener('click', start);
})();
</script>
</body>
</html>
